name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  TZ: Asia/Shanghai

jobs:
  core-and-plugins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Core tests
        run: node core/test.mjs

      - name: Core check
        run: node core/akasha.mjs check

      - name: Plugin selftests
        run: |
          set -e
          for d in plugins/*/; do
            if [ -f "$d/selftest.test.mjs" ]; then
              echo "::group::$d"
              (cd "$d" && node selftest.test.mjs)
              echo "::endgroup::"
            fi
          done
