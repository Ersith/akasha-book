# ⚠ 安装必读（三步，缺一步插件会明确报错拒绝启动，不会静默降级）：
#   1) git clone https://github.com/Ersith/akasha-book && cp -r akasha-book/core <目标目录>/core
#   2) 把下面所有 <AKASHA_DIR> 换成 <目标目录>/core 的绝对路径（Windows 用 / 或 \\ 均可）
#   3) 或者：删掉所有路径字段，设环境变量 AKASHA_DIR=<目标目录>/core（插件默认从它推导）
#   插件启动时会检测未替换的占位符与缺失的 akasha.mjs，直接报错；这是有意的 fail-closed。
- insert:
    - id: akasha-sleep
      name: '@akasha-book/sleep'
      config:
        akashaDir: '<AKASHA_DIR>'
        log: '<AKASHA_DIR>/logs/hooks.jsonl'
        stateFile: '<AKASHA_DIR>/logs/sleep-state.json'
        inboxFile: '<AKASHA_DIR>/logs/inbox.jsonl'
        reportDir: '<AKASHA_DIR>/reports'
        minIntervalHours: 6
        timerCheckMs: 3600000
        contextOrder: 130
