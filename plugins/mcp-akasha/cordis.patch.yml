- insert:
    - id: mcp-akasha
      name: '@akasha-book/mcp'
      config:
        serverName: akasha
        transport: stdio
        # node 可执行文件 + 本仓 core/mcp.mjs 的绝对路径（或用 PATH 中的 node）
        command: 'node'
        args: ['<AKASHA_DIR>/mcp.mjs']
        toolCallTimeoutMs: 600000
        failOnStartupError: false
